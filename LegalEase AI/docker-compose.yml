services:

  backend:

    build: .

    env_file:
      - .env

    command:
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"


  frontend:

    build: .

    env_file:
      - .env

    command:
      streamlit run frontend/app.py
      --server.address 0.0.0.0
      --server.port 8501

    environment:
      BACKEND_URL: http://backend:8000

    ports:
      - "8501:8501"

    depends_on:
      - backend